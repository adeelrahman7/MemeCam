[project]
name = "memecam"
version = "0.1.0"
description = "Webcam gesture detection with live meme reactions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=1.0,<2",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.9,<3",
    "pyside6>=6.8",
]

[project.scripts]
memecam = "memecam.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memecam"]

[tool.uv]
# MediaPipe declares a dependency on opencv-contrib-python, which ships its own
# Qt plugins and clashes with PySide6. Override it away so the only cv2 in the
# environment is opencv-python-headless (MediaPipe's drawing_utils only needs
# `import cv2`, which headless satisfies).
override-dependencies = [
    "opencv-contrib-python; sys_platform == 'never'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
